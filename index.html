<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROBOT</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <h1 class="title-bar">BROBOT</h1>
        <div class="friend-list">
            <h2>Bros</h2>
            <ul>
                <li class="bro">BROBOT</li>
                <li class="bro">John</li>
                <li class="bro">Dave</li>
            </ul>
        </div>
        <div class="chat">
            <h3 class="chat-header">Yappin' with BROBOT</h3>
            <div class="messages">
                <div class="message bot-message">Sup.</div>
                <div class="message user-message">sup. you chillin bro?</div>
                <div class="message bot-message">Hell yeah, big dog. And yourself?</div>
            </div>
            <div class="message-input">
                <input type="text" class="message-field" placeholder="Type a message, bro...">
                <button class="send-button">Send</button>
            </div>
        </div>
    </div>
</body>
</html>
